<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="sidebar-mode">
    <div class="container">

        <!-- Header -->
        <header class="glass-header">
            <div class="header-left">
                <div class="brand-icon">G</div>
                <div>
                    <h1 class="brand-name">GeoLead</h1>
                    <span class="version-tag">v7.0</span>
                </div>
            </div>
            <div id="connection-status" class="status-indicator">
                <span class="dot"></span>
                <span class="text">Connecting...</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Search Config Card -->
            <section class="config-card">
                <div class="form-group">
                    <label for="browser-query">
                        <span class="label-icon">🔍</span> Search Query
                    </label>
                    <input type="text" id="browser-query" placeholder="e.g., Restaurants, Law Firms, SaaS Companies">
                </div>

                <div class="form-group">
                    <label for="browser-location">
                        <span class="label-icon">📍</span> Location
                    </label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="browser-location" placeholder="Start typing a city..."
                            autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <span class="label-icon">⊞</span> Grid Density
                    </label>
                    <div class="segmented-control" id="browser-grid-size-group">
                        <button class="seg-btn" data-value="2">2×2</button>
                        <button class="seg-btn active" data-value="3">3×3</button>
                        <button class="seg-btn" data-value="4">4×4</button>
                        <button class="seg-btn" data-value="5">5×5</button>
                    </div>
                    <input type="hidden" id="browser-grid-size" value="3">
                    <p class="grid-hint">Higher density = more zones = more unique leads</p>
                </div>
            </section>

            <!-- Status Bar -->
            <div class="status-bar">
                <p id="page-status" class="page-status-text">Checking Google Maps...</p>
            </div>

            <!-- Action Buttons -->
            <div class="actions">
                <button id="extract-btn" class="primary-btn" disabled>
                    <span class="btn-text">Start Grid Scan</span>
                    <span class="btn-glow"></span>
                </button>
                <button id="stop-btn" class="danger-btn hidden">
                    <span>⛔ Stop Scan</span>
                </button>
            </div>

            <!-- Progress Section -->
            <section id="progress-section" class="progress-section hidden">
                <div class="progress-header">
                    <span id="progress-zone" class="zone-badge">Zone 1 / 4</span>
                    <span id="progress-percent" class="percent-label">0%</span>
                </div>
                <div class="progress-bar-track">
                    <div id="progress-bar" class="progress-bar-fill" style="width: 0%"></div>
                </div>
                <p id="progress-message" class="progress-message">Initializing...</p>
            </section>

            <!-- Stats Row -->
            <section id="results" class="stats-section hidden">
                <div class="stats-row">
                    <div class="stat-pill">
                        <span class="stat-value" id="found-count">0</span>
                        <span class="stat-label">Found</span>
                    </div>
                    <div class="stat-pill stat-blue">
                        <span class="stat-value" id="scraped-count">0</span>
                        <span class="stat-label">Scraped</span>
                    </div>
                    <div class="stat-pill stat-green">
                        <span class="stat-value" id="saved-count">0</span>
                        <span class="stat-label">Saved</span>
                    </div>
                    <div class="stat-pill stat-orange">
                        <span class="stat-value" id="dup-count">0</span>
                        <span class="stat-label">Dupes</span>
                    </div>
                </div>
            </section>

            <!-- Terminal -->
            <section class="terminal-section">
                <div class="terminal-header">
                    <div class="terminal-dots"><span></span><span></span><span></span></div>
                    <span class="terminal-title">Live Feed</span>
                </div>
                <div id="terminal-log" class="terminal-log"></div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-row">
                <a href="http://localhost:3000/leads" target="_blank" class="footer-link">
                    View Dashboard →
                </a>
                <button id="settings-btn" class="footer-btn">⚙</button>
            </div>

            <!-- Inline Settings -->
            <div id="settings-panel" class="settings-inline hidden">
                <div class="form-group">
                    <label for="api-url">API Endpoint</label>
                    <input type="text" id="api-url" value="http://localhost:4000">
                </div>
                <div class="settings-actions">
                    <button id="save-settings" class="small-btn">Save</button>
                    <button id="copy-debug-log" class="small-btn">📋 Copy Log</button>
                    <button id="clear-debug-log" class="small-btn danger-text">🗑 Clear</button>
                </div>
                <p id="debug-copy-status" class="hint-text"></p>
            </div>

            <p class="footer-version">GeoLead v7.0 — Keep Chrome visible while scanning</p>
        </footer>

        <script type="module" src="sidebar/index.js"></script>
    </div>
</body>

</html>
